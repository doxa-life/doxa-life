<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Map — Doxa.life</title>
  <link rel="icon" href="/favicon.ico">

  <!--
    Standalone embed page for the doxa-research-map MFE bundle.
    Partners can iframe this URL or link to it directly.

    Mapbox token: fetched at runtime from /api/maps/token (Nuxt server
    endpoint). Token NEVER lands in this file — secret-scanning safe.

    base href="/" so the bundle's asset fetches resolve against site root,
    not /research/.
  -->
  <base href="/">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0b0f14;
      overflow: hidden;
    }
    doxa-research-map {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .token-error {
      padding: 20px;
      max-width: 600px;
      margin: 40px auto;
      background: #2a1014;
      border: 1px solid #ff5e5e;
      color: #ffc9c9;
      font: 13px/1.5 ui-monospace, monospace;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<script>
  (async function init() {
    // ── Fetch Mapbox token from server endpoint ──────────────────────────
    let token;
    try {
      const res = await fetch('/api/maps/token');
      if (!res.ok) throw new Error('Token endpoint returned ' + res.status);
      const data = await res.json();
      token = data.token;
      if (!token) throw new Error('Token endpoint returned empty token');
    } catch (err) {
      console.error('[research-map] Failed to fetch Mapbox token:', err);
      document.body.innerHTML =
        '<div class="token-error">' +
        '<strong>Could not load Mapbox token from <code>/api/maps/token</code>.</strong><br><br>' +
        'Check that <code>NUXT_MAPBOX_KEY</code> or <code>NUXT_PUBLIC_MAPBOX_TOKEN</code> ' +
        'is set in the host environment. Error: ' + err.message +
        '</div>';
      return;
    }

    // ── Render the custom element ────────────────────────────────────────
    const config = JSON.stringify({ profile: 'research-map', tk: token, dataSource: 'pray-tools', instanceId: 'embed-research' });
    const el = document.createElement('doxa-research-map');
    el.setAttribute('profile-config', config);
    document.body.appendChild(el);

    // ── Load the MFE bundle (registers <doxa-research-map>) ──────────────
    const s = document.createElement('script');
    s.src = '/js/doxa-research-map.js';
    document.head.appendChild(s);
  })();
</script>

</body>
</html>
