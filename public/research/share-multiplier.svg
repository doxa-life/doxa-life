  <circle cx="400" cy="197" fill="none" stroke="#22c55e" stroke-width="0.8" class="ripple-final2"/>
  <circle cx="102" cy="92" fill="none" stroke="#22c55e" stroke-width="0.8" class="ripple-final"/>
  <circle cx="102" cy="92" fill="none" stroke="#22c55e" stroke-width="0.6" class="ripple-final2"/>
