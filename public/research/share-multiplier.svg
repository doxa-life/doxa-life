  <!-- "prayer surfaces" subtitle -->
  <g class="counter">
    <text x="400" y="488" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" font-weight="400" letter-spacing="0.5">prayer surfaces</text>
