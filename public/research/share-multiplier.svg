    <circle cx="50" cy="40" r="3" fill="#3fb950" opacity="0.7"/>
    <text x="120" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" fill="#8b949e">partner-a.org</text>
    <rect x="30" y="54" width="144" height="88" rx="2" fill="#0b1016"/>
    <!-- Map -->
    <path d="M40,95 Q55,88 70,92 Q85,85 100,90 Q115,86 130,91 Q145,87 160,94 L165,97 Q155,105 140,100 Q120,106 100,100 Q80,107 60,100 Q45,105 38,98 Z" fill="#132218" opacity="0.4"/>
    <circle cx="55" cy="88" r="1.5" fill="#22c55e" opacity="0.8"/>
    <circle cx="75" cy="85" r="1.2" fill="#22c55e" opacity="0.7"/>
    <circle cx="90" cy="90" r="1.8" fill="#22c55e" opacity="0.85"/>
    <circle cx="110" cy="86" r="1.3" fill="#22c55e" opacity="0.6"/>
    <circle cx="130" cy="89" r="1.5" fill="#22c55e" opacity="0.75"/>
    <circle cx="150" cy="92" r="1.2" fill="#22c55e" opacity="0.7"/>
    <circle cx="65" cy="95" r="1" fill="#22c55e" opacity="0.5"/>
    <circle cx="100" cy="98" r="1.3" fill="#22c55e" opacity="0.6"/>
    <circle cx="140" cy="96" r="1" fill="#22c55e" opacity="0.55"/>
  </g>

  <!-- Partner TR -->
  <g class="partner-tr">
    <rect x="616" y="30" width="164" height="120" rx="6" fill="url(#greenGlow)" class="glow-tr"/>
    <rect x="616" y="30" width="164" height="120" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <rect x="616" y="30" width="164" height="20" rx="6" fill="#161b22"/>
    <rect x="616" y="44" width="164" height="6" fill="#161b22"/>
    <circle cx="628" cy="40" r="3" fill="#f85149" opacity="0.7"/>
