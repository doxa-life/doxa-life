    <text x="716" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" fill="#8b949e">church-b.com</text>
    <rect x="626" y="54" width="144" height="88" rx="2" fill="#0b1016"/>
    <path d="M636,95 Q651,88 666,92 Q681,85 696,90 Q711,86 726,91 Q741,87 756,94 L761,97 Q751,105 736,100 Q716,106 696,100 Q676,107 656,100 Q641,105 634,98 Z" fill="#132218" opacity="0.4"/>
    <circle cx="651" cy="88" r="1.5" fill="#22c55e" opacity="0.8"/>
    <circle cx="671" cy="85" r="1.2" fill="#22c55e" opacity="0.7"/>
    <circle cx="686" cy="90" r="1.8" fill="#22c55e" opacity="0.85"/>
    <circle cx="706" cy="86" r="1.3" fill="#22c55e" opacity="0.6"/>
    <circle cx="726" cy="89" r="1.5" fill="#22c55e" opacity="0.75"/>
    <circle cx="746" cy="92" r="1.2" fill="#22c55e" opacity="0.7"/>
    <circle cx="661" cy="95" r="1" fill="#22c55e" opacity="0.5"/>
    <circle cx="696" cy="98" r="1.3" fill="#22c55e" opacity="0.6"/>
    <circle cx="736" cy="96" r="1" fill="#22c55e" opacity="0.55"/>
  </g>

  <!-- Partner BL -->
  <g class="partner-bl">
    <rect x="20" y="310" width="164" height="120" rx="6" fill="url(#greenGlow)" class="glow-bl"/>
    <rect x="20" y="310" width="164" height="120" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <rect x="20" y="310" width="164" height="20" rx="6" fill="#161b22"/>
    <rect x="20" y="324" width="164" height="6" fill="#161b22"/>
    <circle cx="32" cy="320" r="3" fill="#f85149" opacity="0.7"/>
    <circle cx="41" cy="320" r="3" fill="#f0b72f" opacity="0.7"/>
    <circle cx="50" cy="320" r="3" fill="#3fb950" opacity="0.7"/>
    <text x="120" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" fill="#8b949e">missions-c.net</text>
    <rect x="30" y="334" width="144" height="88" rx="2" fill="#0b1016"/>
    <path d="M40,375 Q55,368 70,372 Q85,365 100,370 Q115,366 130,371 Q145,367 160,374 L165,377 Q155,385 140,380 Q120,386 100,380 Q80,387 60,380 Q45,385 38,378 Z" fill="#132218" opacity="0.4"/>
