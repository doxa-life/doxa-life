<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1040-maps · my-upg-100-list staging</title>
  <link rel="icon" href="data:,">

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0b0f14; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 12px 20px; border-bottom: 1px solid #1f2937; background: #111827; flex: 0 0 auto; }
    header h1 { font-size: 14px; font-weight: 600; letter-spacing: .05em; color: #93c5fd; }
    header p  { font-size: 11px; color: #9ca3af; margin-top: 4px; }
    main { flex: 1; position: relative; min-height: 0; }
    my-upg-100-list-map { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>1040-maps · my-upg-100-list (research preview)</h1>
    <p>Tabs: <strong>My UPG 100 List</strong> · <strong>Regions</strong> (cloned from research-map + admin-2 toggle). Source: pray.doxa.life (2106 UPGs).</p>
  </header>
  <main>
    <!-- profile-config:
         profile     = which .vue (bundle root) to mount inside the custom element
         tk          = Mapbox token (Vite swaps %VITE_MAPBOX_TOKEN% from .env at request time)
         dataSource  = sources.json key the bundle resolves at runtime
         instanceId  = isolates window events when multiple embeds exist -->
    <my-upg-100-list-map
      profile-config='{"profile":"upg-100-list","tk":"%VITE_MAPBOX_TOKEN%","dataSource":"pray-tools","instanceId":"staging-1"}'
    ></my-upg-100-list-map>
  </main>

  <!-- Optional: override the API base URL at runtime (defaults to relative if unset) -->
  <script>window.MAP_APP_API_URL = 'https://pray.doxa.life';</script>

  <!-- Surface any uncaught errors to the screen — dev only. -->
  <div id="err-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fef2f2;padding:8px 12px;font:12px ui-monospace,monospace;z-index:9999;white-space:pre-wrap;max-height:40vh;overflow:auto"></div>
  <script>
    (function(){
      const b = document.getElementById('err-banner')
      function show(msg) { b.style.display='block'; b.textContent = (b.textContent ? b.textContent + '\n' : '') + msg }
      window.addEventListener('error', e => show('ERROR: ' + (e.message || e) + (e.filename ? '  @' + e.filename + ':' + e.lineno : '')))
      window.addEventListener('unhandledrejection', e => show('UNHANDLED PROMISE: ' + (e.reason?.message || e.reason || e)))
    })()
  </script>

  <!-- Vite multi-page entry. Served transformed in dev; emits IIFE in build. -->
  <script type="module" src="./index.js"></script>
</body>
</html>
