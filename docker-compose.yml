services:
  postgres:
    image: postgres:18.3-alpine
    container_name: doxa-life-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doxalife
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doxalife"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
